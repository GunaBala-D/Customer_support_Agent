[alembic]
script_location = migrations
# The database URL is never stored here. env.py takes it from the app settings
# (DATABASE_URL / .env / the Settings page) or from `-x url=...` on the command line.
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

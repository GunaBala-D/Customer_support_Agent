server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser only talks to this origin; /api is proxied to the backend container.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 12m;
    proxy_read_timeout 180s;   # local LLMs on CPU can be slow
  }

  location / {
    try_files $uri /index.html;
  }
}

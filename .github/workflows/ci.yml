name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]

    # Started for both legs; only the postgres leg points the tests at it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        if: matrix.database == 'sqlite'
        run: ruff check backend evaluation scripts

      - name: Migrations apply to an empty database and match the models
        working-directory: backend
        env:
          URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://support:support@localhost:5432/support_test' || 'sqlite:///ci_migration_check.db' }}
        run: |
          python -m alembic -x url="$URL" upgrade head
          python -m alembic -x url="$URL" check   # fails if models/db.py changed without a migration
          python -m alembic -x url="$URL" downgrade base

      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://support:support@localhost:5432/support_test' || '' }}
        run: pytest -q

      - name: Evaluation harness smoke test (offline providers)
        if: matrix.database == 'sqlite'
        run: python -m evaluation.run --llm extractive --embedding hash --out-dir "$RUNNER_TEMP/eval"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    name: Docker images and compose file
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t support-backend:ci .
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t support-frontend:ci .
      - name: Backend image can run migrations and start
        run: |
          docker run -d --name api -e LLM_PROVIDER=extractive -e EMBEDDING_PROVIDER=hash \
            -e DATABASE_URL=sqlite:////tmp/ci.db -e AUTO_SEED=true -p 8000:8000 support-backend:ci
          for i in $(seq 1 40); do curl -fsS localhost:8000/api/health && exit 0; sleep 3; done
          docker logs api; exit 1
